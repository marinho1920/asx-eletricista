<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Solicitar orçamento - Eletricista Residencial</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #14181F; color: #F5F6F7; font-family: -apple-system, system-ui, sans-serif; padding: 24px 16px; }
  .card { max-width: 420px; margin: 0 auto; background: #1A202B; border: 1px solid #262D3A; border-radius: 14px; padding: 24px; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  p.sub { color: #8A93A3; font-size: 13px; margin: 0 0 20px; }
  label { display: block; font-size: 11.5px; color: #8A93A3; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.03em; }
  input, textarea { width: 100%; background: #12161D; border: 1px solid #2A3140; color: #F5F6F7; border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-bottom: 14px; font-family: inherit; }
  button { width: 100%; background: #F2B705; border: none; color: #14181F; border-radius: 10px; padding: 13px 16px; font-size: 15px; font-weight: 700; cursor: pointer; }
  button:disabled { background: #3A4150; color: #8A93A3; }
  #msg { font-size: 13px; margin-top: 14px; text-align: center; }
  #msg.ok { color: #2DD4BF; }
  #msg.err { color: #E85D4E; }
</style>
</head>
<body>
  <div class="card">
    <h1>⚡ Solicitar orçamento</h1>
    <p class="sub">Preencha os dados e retornaremos para confirmar o atendimento.</p>
    <form id="form">
      <label>Nome</label>
      <input id="nome" required />
      <label>Telefone</label>
      <input id="telefone" required placeholder="(27) 9xxxx-xxxx" />
      <label>Endereço</label>
      <input id="endereco" required />
      <label>Serviço desejado</label>
      <textarea id="servico" required rows="3" placeholder="Ex: troca de disjuntor, instalação de tomadas..."></textarea>
      <label>Data desejada</label>
      <input id="data" type="date" required />
      <label>Horário desejado</label>
      <input id="hora" type="time" required />
      <button id="btn" type="submit">Enviar pedido</button>
    </form>
    <div id="msg"></div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDv_gG0zZjSv67ln4ptTzmFetx5dm1lds8",
    authDomain: "asx-eletricista.firebaseapp.com",
    projectId: "asx-eletricista",
    storageBucket: "asx-eletricista.firebasestorage.app",
    messagingSenderId: "198949142258",
    appId: "1:198949142258:web:879b0a78bd4b6cf2d41a6b",
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const form = document.getElementById("form");
  const btn = document.getElementById("btn");
  const msg = document.getElementById("msg");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = "Enviando...";
    msg.textContent = "";
    msg.className = "";

    try {
      await addDoc(collection(db, "pedidos-clientes"), {
        nome: document.getElementById("nome").value,
        telefone: document.getElementById("telefone").value,
        endereco: document.getElementById("endereco").value,
        servico: document.getElementById("servico").value,
        data: document.getElementById("data").value,
        hora: document.getElementById("hora").value,
        status: "pendente",
        criadoEm: Date.now(),
      });
      form.reset();
      msg.textContent = "Pedido enviado! Em breve entraremos em contato.";
      msg.className = "ok";
    } catch (err) {
      console.error(err);
      msg.textContent = "Não foi possível enviar. Tente novamente.";
      msg.className = "err";
    } finally {
      btn.disabled = false;
      btn.textContent = "Enviar pedido";
    }
  });
</script>
</body>
</html>
